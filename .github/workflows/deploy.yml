name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the Lambda package
        run: |
          mkdir -p package/data/processed
          cp -r app static package/
          cp data/processed/crashes.db package/data/processed/crashes.db
          python -m pip install -r requirements-api.txt -t package
          cd package && zip -r ../function.zip .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish the function
        run: |
          aws lambda update-function-code \
            --function-name lubbock-crash-analytics \
            --zip-file fileb://function.zip
          aws lambda wait function-updated \
            --function-name lubbock-crash-analytics
          aws lambda update-function-configuration \
            --function-name lubbock-crash-analytics \
            --handler app.handler.handler
